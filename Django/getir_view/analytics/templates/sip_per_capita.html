<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sipariş per Capita</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        input[type="text"], input[type="number"] {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            min-width: 150px;
        }

        button {
            padding: 6px 12px;
            border: none;
            background-color: #0073e6;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005bb5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Order Density per Neighbourhood</h1>

    <form method="get">
        <input type="text" name="district_name" placeholder="District Name" value="{{ request.GET.district_name }}">
        <input type="text" name="hood_name" placeholder="Hood Name" value="{{ request.GET.hood_name }}">
        <input type="number" name="population" placeholder="Population" value="{{ request.GET.population }}">
        <input type="number" name="sip_count" placeholder="Sipariş Count" value="{{ request.GET.sip_count }}">
        <input type="number" step="0.0001" name="sip_per_capita" placeholder="Sipariş per Capita" value="{{ request.GET.sip_per_capita }}">
        
        <div class="filter-actions">
            <button type="submit">Apply Filters</button>
            <a href="{% url 'sip_per_capita' %}"><button type="button">Clear Filters</button></a>
        </div>
    </form>

    <table>
        <thead>
            <tr>
                <th>District</th>
                <th>Hood</th>
                <th>Population</th>
                <th>Sipariş Count</th>
                <th>Sipariş per Capita</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
                <tr>
                    <td>{{ row.district_name }}</td>
                    <td>{{ row.hood_name }}</td>
                    <td>{{ row.population }}</td>
                    <td>{{ row.sip_count }}</td>
                    <td>{{ row.sip_per_capita }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="5">No data found matching the criteria.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
